# ==========================================================================
# Procurement Q&A Dataset Pipeline — Configuration
# --------------------------------------------------------------------------
# Everything the pipeline needs is declared here so a re-run is fully
# reproducible and adding new sources requires NO code changes.
# ==========================================================================

# --- Target output --------------------------------------------------------
target_pairs: 25          # how many final Q&A pairs we want
random_seed: 42           # fixes sampling / shuffling for reproducibility

# --- Models ---------------------------------------------------------------
models:
  # Generation + judging both run locally through Ollama.
  generator: "qwen2.5:7b-instruct"     # reads a passage, writes cited Q&A
  judge: "qwen2.5:7b-instruct"         # LLM-as-judge for validation (Phase 4)
  ollama_host: "http://localhost:11434"
  temperature: 0.4                     # low = more grounded, less inventive
  # Embeddings run locally via sentence-transformers (CPU/GPU).
  embedder: "sentence-transformers/all-MiniLM-L6-v2"

# --- Chunking (Phase 2) ---------------------------------------------------
chunking:
  method: "semantic"        # "semantic" | "fixed"
  target_tokens: 220        # approx passage size
  min_tokens: 80            # discard chunks smaller than this
  breakpoint_percentile: 90 # semantic split sensitivity (higher = fewer splits)

# --- Validation thresholds (Phase 4) — mirror the KPI table ---------------
validation:
  groundedness_min: 0.60    # keyword+embedding overlap answer<->passage
  relevance_min: 0.60       # procurement-domain relevance
  dedup_cosine_max: 0.90    # drop pairs more similar than this to another
  judge_quality_min: 3      # 5-point rubric, keep >= 3

# --- Topic taxonomy — drives the diversity KPI (>= 5 sub-topics) ----------
# Passages get tagged to the closest topic by embedding similarity.
topics:
  - "tender process"
  - "supplier evaluation"
  - "contract management"
  - "logistics and KPIs"
  - "procurement policy and compliance"
  - "risk and sustainability"
  - "e-procurement and data standards"

# --- Sources (Phase 1) ----------------------------------------------------
# 15 open sources, rebalanced toward authoritative law/policy/standards.
# Only ~33% Wikipedia, kept for definitional/conceptual topics where it is
# genuinely reliable. license is recorded in the manifest (citation KPI).
# type: "html" (scrape readable text) | "pdf" (extract text)
#
# NOTE: gov/legal portals can be JS-heavy or large. Phase 1 fetches each
# source independently and fails gracefully, so one bad URL never kills the
# run; if a source extracts poorly we swap it during Phase 1 inspection.
sources:

  # --- Authoritative anchors ---------------------------------------------
  # NOTE 1: EUR-Lex Directive 2014/24/EU was trialled but returned an empty
  # body to non-browser HTTP requests (JS-rendered / session-gated). Dropped
  # rather than adding a headless-browser dependency; EU concepts remain via
  # UNCITRAL. Recovering it with Playwright is noted as a future improvement.
  # NOTE 2: FAR Parts 1, 2, 6 were collected but dropped after chunk
  # inspection — their table-of-contents structure and dense legal
  # cross-referencing ("see subpart 13.5", "10 U.S.C. 3201") produced
  # fragmented, low-content chunks unsuitable for grounded Q&A. FAR Part 9 is
  # retained as its prose was the most coherent. This trades a little source
  # diversity for materially better chunk quality (groundedness KPI).
  - id: uncitral_model_law
    url: "https://uncitral.un.org/en/texts/procurement/modellaw/public_procurement"
    license: "UN open / free reuse"
    type: html
    topic: "procurement policy and compliance"
  - id: far_part9_qualifications
    url: "https://www.acquisition.gov/far/part-9"
    license: "US Government public domain"
    type: html
    topic: "supplier evaluation"

  # --- Standards / official guidance -------------------------------------
  - id: ocds_primer_what
    url: "https://standard.open-contracting.org/latest/en/primer/what/"
    license: "Apache-2.0 / CC-BY (Open Contracting Partnership)"
    type: html
    topic: "e-procurement and data standards"
  - id: ocds_building_blocks
    url: "https://standard.open-contracting.org/latest/en/getting_started/building_blocks/"
    license: "CC-BY (Open Contracting Partnership)"
    type: html
    topic: "e-procurement and data standards"
  - id: worldbank_beginners_guide
    url: "https://thedocs.worldbank.org/en/doc/caf6a3f677305292d799dbe55fd83bfe-0290012023/original/PROCUREMENT-Beginners-Guide-to-IPF-WEB-VERSION-Nov-2023.pdf"
    license: "CC BY 3.0 IGO (World Bank open access)"
    type: pdf
    topic: "supplier evaluation"

  # --- Open-access research ----------------------------------------------
  - id: arxiv_digital_procurement
    url: "https://arxiv.org/pdf/2303.03882"
    license: "arXiv.org perpetual non-exclusive license (open access)"
    type: pdf
    topic: "risk and sustainability"

  # --- World Bank topic-specific guidance (from suggested source list) ----
  # Clean, prose-rich official PDFs, each targeting a specific sub-topic to
  # strengthen coverage and reduce reliance on Wikipedia.
  - id: worldbank_value_for_money
    url: "https://thedocs.worldbank.org/en/doc/a535313d21a71139c93f09311e274093-0290012023/original/Procurement-Guidance-Value-for-Money-Nov-2023-WEB.pdf"
    license: "CC BY 3.0 IGO (World Bank open access)"
    type: pdf
    topic: "tender process"
  - id: worldbank_supply_chain_mgmt
    url: "https://thedocs.worldbank.org/en/doc/1c3b517f003b53a2e2e170e93124be84-0290032023/original/World-Bank-Supply-Chain-Management-Guidance.pdf"
    license: "CC BY 3.0 IGO (World Bank open access)"
    type: pdf
    topic: "logistics and KPIs"

  # --- Wikipedia (clean definitional / conceptual prose) -----------------
  - id: wikipedia_tco
    url: "https://en.wikipedia.org/wiki/Total_cost_of_ownership"
    license: "CC BY-SA 4.0"
    type: html
    topic: "supplier evaluation"
  - id: wikipedia_incoterms
    url: "https://en.wikipedia.org/wiki/Incoterms"
    license: "CC BY-SA 4.0"
    type: html
    topic: "logistics and KPIs"
  - id: wikipedia_sla
    url: "https://en.wikipedia.org/wiki/Service-level_agreement"
    license: "CC BY-SA 4.0"
    type: html
    topic: "contract management"
  - id: wikipedia_supplier_risk
    url: "https://en.wikipedia.org/wiki/Supply_chain_risk_management"
    license: "CC BY-SA 4.0"
    type: html
    topic: "risk and sustainability"
  - id: wikipedia_green_proc
    url: "https://en.wikipedia.org/wiki/Sustainable_procurement"
    license: "CC BY-SA 4.0"
    type: html
    topic: "risk and sustainability"

# --- Paths ----------------------------------------------------------------
paths:
  raw: "data/raw"
  processed: "data/processed"
  output: "data/output"