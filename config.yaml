    type: html
  - id: wikipedia_rfp
    url: "https://en.wikipedia.org/wiki/Request_for_proposal"
    license: "CC BY-SA 4.0"
    type: html
  - id: wikipedia_sla
    url: "https://en.wikipedia.org/wiki/Service-level_agreement"
    license: "CC BY-SA 4.0"
    type: html
  - id: wikipedia_incoterms
    url: "https://en.wikipedia.org/wiki/Incoterms"
